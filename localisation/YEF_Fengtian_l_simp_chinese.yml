l_simp_chinese:
 #新的联省派通用国策
 FNG_Harmony_Difference:0 "和而不同"
 FNG_Harmony_Difference_desc:0 "统一战争既告结束，举国上下最迫切的事情，便是如何使这片饱经兵燹的土地重新安定下来。北方的旧官僚、南方的地方领袖、各省议会中的绅商名流，以及那些手握兵权而不愿轻易交出地盘的督军们，眼下都在等待一个能够容纳各方的政治安排。若仍以一纸中央命令强求各地俯首，恐怕不过是为下一场兵祸埋下种子。\n联省自治的主张恰好提供了这样的机会。各省可以保留自己的政制、财赋与地方武力，中央则以共同约章维系名义上的统一。至于国家究竟应当由谁来主持，地方与中央又该如何分配权柄，这些问题自然可以留待各省代表慢慢商议。只要各方都能从中得到好处，这场新政便有望顺利开张。"

 FNG_Common_Charter:0 "颁布共同约章"
 FNG_Common_Charter_desc:0 "联省自治既以各省自定省宪为开端，便不能没有一套共同遵守的章程。新政府召集法政界人士与各省代表，着手拟订约法草案，将中央政府的权限、各省应尽的义务以及彼此间的交涉办法逐一列明。外交、关税与共同防务等事项虽仍须由中央出面，各省却有权对其施行方式提出意见。\n这份约章究竟能否成为国家长治久安的根本，眼下尚无人敢作断言。各省代表更关心的是，约章能否保障他们现有的权利，能否使中央不再以统一之名干涉地方事务。"

 FNG_Reorganize_Governorship:0 "督署改组"
 FNG_Reorganize_Governorship_desc:0 "联省自治既要有宪法约章，也须有与之相称的地方官制。过去各省督军公署往往集军政、财政、司法诸权于一身，省长、厅长与各级官吏不过是督署属员，地方议会更难以过问实际政务。如今既然要以省宪为各省根本，便有必要将旧有督署改组为省政府，重新厘定各机关的名义与职掌。\n此举自然会触动一批旧人的利益。各省督军未必愿意放弃手中的权柄，地方官僚也担心改组之后另有一番人事更替。为免节外生枝，政府决定以改组名义保留原有行政班底，并酌情安排旧日军政首领出任省长或其他要职。至于这些新官署究竟能有多少实权，仍须看各地实力如何。"

 FNG_States_Before_Federation:0 "有邦而后有联邦"
 FNG_States_Before_Federation_desc:0 "联省自治的根本，在于各省先有能够自理其政务的制度，然后再由各省共同组织中央政府。湖南方面早已颁行省宪，广东也曾试图以县政自治为基础推行地方宪制；云南方面则屡次倡议各省联席议事，以和平方式厘清中央与地方的权限。这些先行之举虽各有得失，却足以说明地方制度不能一概由中央代为规定。\n政府将鼓励各省依照本地情形拟订省宪，规定省议会、省政府及地方首长的权限。至于省长由何种方式产生，议会应有多少监督之权，地方防军又该如何处置，则交由各省自行商定。只要各地能够拿出一套章程，联省政府便有了赖以成立的基础。"

 FNG_Permanent_Federal_Conference:0 "常设联席会议"
 FNG_Permanent_Federal_Conference_desc:0 "过去各省虽曾屡次通电呼吁联省自治，然而通电终究不能代替会议，临时集会也难以处理日常政务。中央与各省之间若缺少一个固定的商议机关，凡遇军费、税款、铁路、边界乃至人事任免，仍免不了彼此猜忌，甚至诉诸武力。云南省代表主张设立常设联席会议，令各省定期派员赴会，共同商议国家大政。\n会议代表的名额与资格，当然不能只凭人口多寡决定。各省的财力、兵力、地位与历史沿革，都须在议席安排中有所体现。那些曾经出兵、垫款或为联省事业奔走的实力派，自然也应得到相应的发言权。至于会议议决之后各省是否照办，还得仰赖各省长官的通融。"

 FNG_Local_Garrisons:0 "防军留镇，地盘互保"
 FNG_Local_Garrisons_desc:0 "各省实力派之所以愿意接受联省自治，最要紧的一项条件，便是不得借中央统一之名裁撤其部队、夺取其防区。地方防军既是维持一省秩序的凭借，也是各省长官在联席会议上讨价还价的本钱。若贸然要求各军缴械归并，恐怕约章尚未议定，枪炮便已先行开火。\n政府决定暂时承认各省现有防军的编制与驻地，并由有关各方互相承认现有防区，约定不以武力侵夺邻省地盘。各省如有边界争端，可先行会商，必要时再由联席会议出面调停。如此一来，昔日兵戎相见的督军们便能在新约章之下各安其位，至于国家是否因此失去统一调度军队的能力，似乎已不是他们眼下最关心的事情。"

 FNG_Military_Civilian_Division:0 "厘定军民权限"
 FNG_Military_Civilian_Division_desc:0 "督军专擅一省军政，向来是地方政治中最难处置的积弊。军队干涉民政，军需侵吞税款，地方官吏又往往受制于军人，省议会即使有所议决，也未必能够贯彻施行。若要使省宪不至于成为一纸空文，便须将军务与民政的权限分别厘定，使省政府、议会与驻军机关各有职掌。\n依照新章，田赋、司法、教育及地方行政等事务应由文官机关办理，驻军则以防务和维持治安为主要职责。各省可以设立相应机关监督军需与军费，但不必因此立即撤换旧有将领。这样的安排既能给地方议会留出几分颜面，也不至于使督军们觉得自己已经失去了立足之地。至于军人是否真肯安分守己，终究还得看各省政府有多少本事。"

 FNG_Local_Revenue_Survey:0 "清查地方财赋"
 FNG_Local_Revenue_Survey_desc:0 "各省多年兵争，田赋、厘金、盐税与矿税早已被层层摊派，许多税款尚未入库，便已被军队、地方机关及各路债主预先支取。各省政府虽都声称财力困窘，却又说不清究竟有多少收入落入了各级机关之手。若不先行清查账目，所谓划分国地税权，不过是各省凭空争夺一笔糊涂账。\n政府将派员会同地方财政机关、商会及税务人员，调查各地田赋、厘金、盐务、矿产与其他收入，并核对历年借款、垫款及军政支出。各省对于本地财赋自然另有一番说辞，地方官吏也未必愿意将账目尽数呈报。好在联省政府并不打算追究过去的种种亏空，只要各方肯交出一份可以商议的账册，便算达到了目的。"

 FNG_Central_Local_Taxation:0 "划分央地税权"
 FNG_Central_Local_Taxation_desc:0 "财赋既经清查，中央与地方之间便须议定各自的税收范围。关税、盐税、田赋、厘金及各项杂捐，过去或由中央征收，或为地方截留，名目繁多，彼此纠缠。如今各省既已取得相当程度的自治权，自然不肯再将本地主要收入尽数解交中央；而中央若连维持机关所需的经费都无法筹措，也就谈不上主持全国事务。\n经各省代表商议，田赋及若干地方税收将主要留供本省支用，中央则保留关税及约定的共同财政收入，各省另按章程承担必要的中央经费。这样的办法看似各有分配，实则仍须依赖各省按时解款。若遇财政困难，地方政府自有一套缓办、扣留与另行商议的理由；中央对此也只能设法周旋。"

 FNG_Jin_Yue_Experience:0 "推广晋粤经验"
 FNG_Jin_Yue_Experience_desc:0 "地方自治并非只有省议会与省政府一途。山西方面早已推行村本政治，以村为基层组织，办理农事、治安及公共事务；广东方面则曾倡议自乡村而县政、由县政而省宪，逐步建立地方自治的制度。两地办法虽不尽相同，却都证明乡村与县份不能永远只是上级官署的附庸。\n政府决定选取晋粤两地的若干办法，交由各省酌情推广。各地可依本地情形组织村公所、乡自治会及县级议事机关，办理水利、农事、教育与地方治安。至于这些机关究竟能有多少自主权，仍由各省自行规定。如此既可为联省自治增添一层基层根基，也能让地方士绅、商会与乡村领袖在新政之中各得其所。"

 FNG_Local_Bonds:0 "开放地方举债"
 FNG_Local_Bonds_desc:0 "各省财政既已分别核算，便不能事事仰赖中央拨款。多年兵灾留下的旧债尚未清偿，铁路、水利、矿山与市政工程又处处待办，单凭田赋和厘金收入显然难以支撑。地方政府若想另谋出路，便须重新取得银行、钱庄与商界的信任，使公债不再成为一纸无人问津的空文。\n政府将准许各省依照本地财力发行公债，或向银行、钱庄及商办团体借款，并可酌以地方税收、盐务收入及实业收益作为偿还担保。至于旧日借款究竟由谁承认，地方政府可以分别与债权人商议展期、减息及偿还办法。各省长官对此自然十分欢迎：既然债务可以留在本地，借来的款项也就不必再经过中央之手。"

 FNG_Foreign_Investment:0 "招徕外商投资"
 FNG_Foreign_Investment_desc:0 "地方财政若要有所起色，除了发行公债，还须设法招徕外来资本。各地矿山、林场、铁路与航运事业，多因资金不足而迟迟不能开办；即使已有设备，也往往缺乏熟练技师与经营人才。过去凡有外商提出承办要求，中央与地方之间常因权限不明而争执不休，如今既已划定各省财权，便可以由地方政府自行出面交涉。\n各省将分别拟订招股、租借与特许章程，向外商提供土地、税收减免及一定年限的经营权，以换取资金、机器与技术。铁路沿线、矿产丰富之地，以及港埠附近的工商业尤受欢迎。对于投资者提出的附带条件，各地可以自行斟酌办理；只要能够取得眼前的款项与设备，至于日后收益如何分配，倒还可以留给后任政府去操心。"

 FNG_Village_Politics:0 "村本政治"
 FNG_Village_Politics_desc:0 "山西的村本政治，向来以村庄为施政的根本。村中有公所，有乡约，有地方绅董与农事组织，凡水利、植树、治安及日常公益，均可由乡民共同商议办理。阎锡山所推行的这一套办法，固然带有浓厚的地方色彩，却也使地方官署得以将政令深入乡村，而不必事事依靠县衙派员督办。\n联省政府决定将村本政治列为地方自治的重要办法，鼓励各省设立村公所与村政会议，推举地方绅董、农事领袖及有声望的乡民参与其事。村中各项公共事务可由乡民议定，所需经费则由地方筹措。对于那些一向只知向官府请款、却不肯自行出力的乡村，此举或许能使他们重新担负起地方事务；而地方官署也将因此多出一批可以借助的基层人手。"

 FNG_County_Councils:0 "推行县议会"
 FNG_County_Councils_desc:0 "县为一省行政的基础，也是乡村与省政府之间最重要的关节。陈炯明早年倡议地方自治时，便主张由乡村组织逐步推至县政，设立县议会，并以民选县长主持地方事务。这样的办法既能使地方民意有所表达，也能减少县政完全受制于上级官署的弊病。\n各省将依照省宪规定，逐步设立县议会，选举或推举县级行政首长，并赋予议会审议地方预算、监督县政及办理公共事业的权限。至于选举资格、议员名额与县长产生办法，则交由各省自行订定。地方绅商与乡村领袖将因此获得新的政治位置，县政也可以在他们的主持下逐渐恢复秩序。"

 FNG_Interprovincial_Trade:0 "省际通商章程"
 FNG_Interprovincial_Trade_desc:0 "各省既已分别筹措财源、承办实业，省界之间的关卡与厘金便成了商旅往来的大患。货物从一省运往邻省，常须经过数道关卡，重复缴纳厘金与各项杂捐；铁路、航运与公路的经营，也往往因各省章程不同而彼此掣肘。地方政府固然不愿放弃这些收入，商人却早已对此怨声载道。\n联省会议决定拟订省际通商章程，约定若干主要商品的过境办法，商议减免重复征收的厘金，并协调铁路、航运与港埠之间的转运事务。各省仍可保留本地税收与管理权，但不得无故阻碍邻省商货通行。对于那些早已在各省取得经营特许的商办公司而言，这份章程更是不可多得的便利。"

 FNG_Six_Policies_Three_Affairs:0 "六政三事"
 FNG_Six_Policies_Three_Affairs_desc:0 "阎锡山在山西推行地方建设，曾以水利、植树、蚕桑、禁烟、天足、剪发为六政，又以种棉、造林、畜牧为三事，令各县乡村逐项办理。此类事业看似琐碎，却与农民日常生计息息相关；若能由村镇逐级推行，既可改善地方风气，也能使乡村生产有所增长。\n联省政府决定将六政三事的办法介绍各省，准许地方官署依照本地情形择要施行。各县可设劝导机关，召集乡绅、农会与地方团体，办理水利修筑、植树造林、蚕桑改良及畜牧推广等事。对于禁烟、天足与剪发等事务，也可由地方团体劝导办理，不必一概仰赖官府强制。各省若能借此整顿乡村，既可增加地方物产，也能为新政府挣得几分爱民的名声。"

 FNG_Restore_Old_Capital:0 "光复旧京"
 FNG_Restore_Old_Capital_desc:0 "北京城里曾经有过一段属于安福俱乐部的年月。那时的王揖唐身居众议院议长之位，俱乐部里每日往来着议员、官僚、商人和各色说客。有人负责打探消息，有人专司联络，有人替各方调停，还有人专门计算选票与经费。安福俱乐部的名声固然不佳，但若论组织议员、经营人事和打通官场关节，当年还真没有几家能与之相比。如今光复旧京，故人终于有机会重新聚首。至于当年那些旧账，既然已经过去了这么多年，倒也未必不能重新商量。"

 FNG_Recruit_Zhili_Old_Officials:0 "延揽直系旧僚"
 FNG_Recruit_Zhili_Old_Officials_desc:0 "吴佩孚旧部在多年军政经营中，早已形成一套颇具规模的文官网络。从省府厅局到县署科室，不少熟悉地方行政的旧僚仍在各处任职，掌握着税务、警政、司法与地方财政的实际运作。新政府若要迅速接管各地，便不能只靠从奉天派出的少数亲信。昔日直皖两系的政争固然留下不少嫌隙，但如今各方都需要一个重新安排前程的机会。"

 FNG_First_Party_in_New_Parliament:0 "新国会下第一党"
 FNG_First_Party_in_New_Parliament_desc:0 "没有任何其他的组织、联盟、政党或团体能够承担起领导中国的重任。这头野兽是其他人所难以理解的。我们并非民主的布道者，也不会天真地固守专制，我们秉持的是唯一能够最终实现公民权利、民生福祉、教育发展与社会稳定的正确道路。"

 FNG_Administrative_Judicial_Reorganization:0 "行政与司法整备"
 FNG_Administrative_Judicial_Reorganization_desc:0 "朱深早年留学日本研习法政，归国后历任大理院及京师司法机关职务，对旧日中央司法系统的人员与章程颇为熟悉。眼下各级机关沿用的制度不一，旧有官员与新任人员之间也时有龃龉，若不尽快厘清权限，政令便难以贯彻。朱深将主持行政与司法部门的整顿，核定机关编制，审查官员履历，修订彼此抵牾的规章，并重新安排各级司法机关的人事。熟悉法政、办事可靠的人士将得到任用，原有机构中那些盘根错节的人事关系也将借此重新梳理。"

 FNG_Pacify_Nation_Benefit_People:0 "安国福民"
 FNG_Pacify_Nation_Benefit_People_desc:0 "“安国福民”曾是旧皖系政府政纲中颇受重视的一句话。王揖唐认为，所谓安国，首先要结束连年政争与地方纷扰，使政府能够发号施令；所谓福民，则要让百姓的生计有所依托，使工商各业得以恢复。如今新政权需要一套能够统摄各项施政的纲领，这句口号也就重新被提了出来，以恢复国民对我们的信心。"

 FNG_Wangdao_Alliance:0 "王道主义的盟约"
 FNG_Wangdao_Alliance_desc:0 "在日本方面看来，中国政局的混乱恰恰证明了旧有政治制度已经走入穷途。东京的政界与军部人士不断鼓吹东亚协作，声称应当以王道精神取代西方列强的强权政治，并在中国寻找能够与之相呼应的政治人物。既然日本方面愿意提供政治承认、经济援助与必要的活动空间，作为交换，王揖唐政府也愿意在外交、军事和经济事务上作出相应安排。"

 FNG_New_Citizen_Movement:0 "倡行新民运动"
 FNG_New_Citizen_Movement_desc:0 "新政府建立以后，日本顾问们开始在政界鼓吹一套新的思想教化主张。他们从儒家经典《大学》的「在新民」中取义，将传统的修身伦理与现代国民教育结合起来，提出以王道精神改造社会、重塑国民的新思想。这套理论被称为“新民主义”，主张革除旧有政治积习，提倡道德修养、社会纪律与国民团结，并将反赤、亲善日本和建设东亚新秩序纳入其中。王揖唐等亲日政客对此积极响应，认为它足以为新政权提供一套不同于旧日党争的思想纲领。\n\n新民运动由此应运而生。政府将组织学校、报刊、青年团体与各业人士参与教化，逐步建立覆盖城乡的国民组织，以新民主义统一思想、整饬风俗，并使各地社会团体服从新政权的指导。"

 FNG_Renew_Livelihood_Study_Society:0 "重启民生主义研究会"
 FNG_Renew_Livelihood_Study_Society_desc:0 "1919年，王揖唐曾在安福部议员大会上提出设立民生主义研究会，援引古代均田均耕之说，又将近代社会主义纳入讨论。当时正值各界热议主义与社会问题之际，安福系也不愿落后于这股风潮。如今旧日故技重施，王揖唐打算重新搬出这块招牌，大谈社会主义、土地与民生，以此为安福系披上一层关心社会改革的外衣。" 

 FNG_Oriental_Culture_and_Morality:0 "东方文化道德"
 FNG_Oriental_Culture_and_Morality_desc:0 "新民主义以发扬东方文化道德为立论之本。所谓新民，首先在于重振中国固有的纲常伦理，表彰先贤遗训，以王道精神维系社会秩序。日本方面对此尤为热心，认为儒家传统足以成为东亚各国共同的精神纽带，也能够抵御工团主义与西方自由思想的传播。政府将着手编订教化读本，整顿学校课程，并借助报刊、讲演和文化团体宣传东方道德。各地熟悉经学与旧式礼教的士绅，也将被吸纳进这场声势浩大的文化运动之中。"

 FNG_Establish_Local_Maintenance_Associations:0 "建立地方维持会"
 FNG_Establish_Local_Maintenance_Associations_desc:0 "新民主义若要深入乡里，单靠报刊宣传与学校教育显然远远不够。各地原有的商会、同业公会、乡村自治组织与慈善团体，早已拥有各自的人脉和活动网络，正好可以成为新民运动的依托。政府将推动各县设立地方维持会，吸收地方士绅、商界人士及旧有团体的代表，负责联络民众、推行教化、协助地方建设，并组织乡村自卫力量。各类民间组织也须登记备案，接受维持会的指导。借助这些基层机构，新民主义便能从官署与学校走入街巷乡村，而地方上原本各自为政的势力，也将逐渐被纳入新政权的掌握之中。"

 FNG_Adopt_Houzheng_Experience:0 "借鉴厚生事业"
 FNG_Adopt_Houzheng_Experience_desc:0 "日本各地的厚生事业已有多年积累，从贫民救济、妇幼保育到卫生设施与社会福利，逐渐形成了由地方团体、慈善机构和行政部门共同承办的办法。政府决定引入这套经验，先从华北各地较有基础的城市着手，设立保育所、诊疗所与贫民救济设施，并鼓励商会、慈善团体和地方人士参与经营。"

 FNG_Grain_Price_Relief:0 "平粜救济"
 FNG_Grain_Price_Relief_desc:0 "粮食关系千家万户，一遇歉收或运输不畅，市面上的米价便会先有反应。新民主义既然以安定民生为号召，粮价自然不能完全交给市场自行处置。政府将设立平粜基金，委托地方维持会会同商会调查粮情，择地购入粮食，设仓储备，并在粮价上涨时按定价出售。各地还可视情况向粮商借粮，或协调铁路与水运优先承运。参与平粜的商号将获得一定的税务和运输便利，账目则须定期呈报。平粜未必能使粮价始终低廉，至少要让百姓知道，官府仍在设法管这碗饭。"

 FNG_Land_Development_Cooperation:0 "地产开发合作"
 FNG_Land_Development_Cooperation_desc:0 "日本方面在都市改造、交通沿线开发和住宅建设上积累了不少经验，我国各地也有大批等待整理的旧城地块与荒闲土地。政府将选定若干地区，清查地籍，规划道路、市场与住宅用地，再邀请地产公司、金融机构及地方商人共同投资。开发所得可以用于地方建设，参与其中的商号也能获得土地经营与工程承办的机会。"

 FNG_Reconcile_Social_Classes:0 "调和社会各阶级"
 FNG_Reconcile_Social_Classes_desc:0 "“伊古立国，首重民生；今建共和，尤崇民意。频年变乱，苦民久矣，民敝政紊，云胡不亡？惟平乃和，亦惟平乃久。必人人有正当发展之余地，而后无政治之争；必政治由正当轨道以进行，而后无党争之祸。”"